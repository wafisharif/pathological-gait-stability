    torch.load = _torch_load_patched\nimport deprl, myosuite\nimport gym\nimport sys,\
    \ os\nsys.path.insert(0, 'Code/controllers/imitation_reward')\nfrom myoleg_walk_stroke_tier3\
    \ import WalkEnvV0StrokeTier3\ntry:\n    gym.register(id='myoLegWalkStrokeTier3-v0',\
    \ entry_point=WalkEnvV0StrokeTier3, max_episode_steps=1000, kwargs={'model_path':\
    \ os.path.join(os.path.dirname(myosuite.__file__), 'envs/myo/myobase/../../../simhive/myo_sim/leg/myolegs_v0.56(mj237).mjb'),\
    \ 'normalize_act': True, 'min_height': 0.8, 'max_rot': 0.8, 'hip_period': 100,\
    \ 'reset_type': 'random', 'target_x_vel': 0.0, 'target_y_vel': 1.2, 'target_rot':\
    \ None})\nexcept gym.error.Error:\n    pass"
